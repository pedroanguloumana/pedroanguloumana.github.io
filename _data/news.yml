

- date: "May 2026"
  text: "I was invited to give a guest lecture for the SNU graduate tropical meteorology class on the subject of vertical normal modes. The lecture notes I wrote in preparation are available [here](assets/docs/vertical_normal_modes.pdf)"

- date: "May 2026"
  text: "I'm a co-author on a study, led by Professor Sara Shamekh, that uses machine learning to discover interpretable equations describing what determines convective and stratiform precipitation areas, that was published in [JAS](https://journals.ametsoc.org/view/journals/atsc/aop/JAS-D-25-0178.1/JAS-D-25-0178.1.xml)."

- date: "February 2026"
  text: "I spent a couple of months visiting the University of Washington. It was nice to be back!"

- date: "December 2025"
  text: "My paper, \"Multiscale Convective Circulations and Scale Interactions in a Global Storm-Resolving Model\", has been published in [JAMES](https://agupubs.onlinelibrary.wiley.com/doi/full/10.1029/2025MS005032)."


- date: "December 2025"
  text: "I presented a [poster](https://agu.confex.com/agu/agu25/meetingapp.cgi/Paper/1942397) on the morphology of tropical precipitation extremes at AGU in New Orleans."


- date: "September 2025"
  text: "I gave a department seminar at SNU, sharing my research on the connection between the spatial shape of tropical precipitation systems and their capacity to produce extreme rain events."
  images:
    - src: /assets/images/SNU_Talk.PNG
      class: wide

- date: "July 2025"
  text: "I presented my research on multiscale circulations in a global storm-resolving model at [BACO-25](https://baco-25.org/new/sub1/sub11.asp) in Busan."

- date: "July 2025"
  text: "I began my postdoc at Seoul National University, working with Daehyun Kim."
  images:
    - src: /assets/images/sea_2_icn.jpg
      class: wide

- date: "March 2025"
  text: "I defended my PhD dissertation. While I am generally wary of numerology, I choose to take my defense date being π-day as a good omen."
  images:
    - src: /assets/images/phd_poster.jpg
      class: wide


- date: "June 2024"
  text: "I gave a talk at the 4th Workshop on Convective Organization and Precipitation Extremes at the Abdus Salam International Centre for Theoretical Physics. I also participated in the [5th Summer School on Theory, Mechanisms and Hierarchical Modelling of Climate Dynamics](https://indico.ictp.it/event/10490). It was a real treat to meet so many scientists and students from across the world."
  images:
    - src: /assets/images/summer_school_2024_ictp.jpg
    - src: /assets/images/WCO4.jpg
    - src: /assets/images/team_project.jpeg

- date: "May 2024"
  text: "I gave a talk on my research into scale interactions and tropical convection at [AMS Tropical in Long Beach, CA](https://ams.confex.com/ams/36Hurricanes/meetingapp.cgi/Paper/442335)."


- date: "January 2023"
  text: "I presented a poster, \"[Investigating the Influence of Mesoscale Convective Organization on Tropical Precipitation in a Global Cloud-Resolving Model](https://ams.confex.com/ams/103ANNUAL/meetingapp.cgi/Paper/421710)\", at the Annual Meeting of the AMS in Denver, Colorado."

- date: "January 2023"
  text: "My paper, \"Mesoscale Convective Clustering Enhances Tropical Precipitation\", co-authored with my advisor Daehyun Kim, has been published in [Science Advances](https://www.science.org/doi/10.1126/sciadv.abo5317). I am officially a published climate scientist!"

- date: "September 2022"
  text: "I was able to participate in a two week intensive course on atmospheric instrumentation and ARM at [Pacific Northwest National Laboratory](https://armgov.svcs.arm.gov/news/facility/post/82899). I'm extremely grateful to Professor Lynn McMurdie and Lexie Goldberger for organizing the course, and to all the PNNL scientists who took the time to teach us lowly graduate students about how atmospheric observations are taken and processed."
  images: 
    - src: /assets/images/pnnl_course.jpg
      class: wide

- date: "July 2022"
  text: "I got to participate in the delightfully-named [Rossbypalooza summer school](http://www.rossbypalooza.org/rossby2022/), hosted by the University of Chicago. This year's topic was \"Clouds and convection in diverse climates\". I greatly enjoyed the getting to make so many friends from other institutions who also like thinking about moist convection on Earth and/or other planets!"
  images: 
    - src: /assets/images/rossbypalooza.jpeg
      class: wide
    - src: /assets/images/rossbypalooza_2.jpeg
      class: wide

- date: "May 2022"
  text: "My first in-person conference as a grad student! I gave a talk on my master's work at [AMS Tropical in New Orleans](https://ams.confex.com/ams/35Hurricanes/meetingapp.cgi/Paper/401654). I also helped to co-chair a session with Drs. Brandon Wolding and Zeljka Fuchs-Stone."


- date: "March 2022"
  text: "I defended my Master's thesis work on the effects of mesoscale convective clustering on tropical precipitation. I am now, officially, a Master of Science™!"
  images:
    - src: /assets/images/masters_announcement.jpg
      class: wide

- date: "January 2022"
  text: "Gave a virtual talk at the [AMS Annual Meeting](https://ams.confex.com/ams/102ANNUAL/meetingapp.cgi/Paper/397298)."

- date: "Summer 2021"
  text: "I got the chance to teach (like *really* teach) Introduction to Climate and Climate Change (ATMS 211) this summer. Preparing and recording five virtual lectures a week, designing and grading assignments, and hosting office hours was all as taxing as it was rewarding."
  images:
    - src: /assets/images/teaching_211.jpg
      class: wide

- date: "March 2021"
  text: "I'm honored to have received an Honorable Mention from the NSF Graduate Research Fellowship Program."

- date: "September 2020"
  text: "I got to co-chair a session on extreme precipitation at the [Summer Institute on Climate Extremes and Climate and Environmental Equity](https://pcc.uw.edu/2020/10/08/2020-pcc-si-climate-extremes-and-climate-and-environmental-equity/), hosted by the [University of Washington Program on Climate Change](https://pcc.uw.edu/)."

- date: "July 2020"
  text: "Finished my first year at the University of Washington! I got my first real taste of graduate coursework, research, and giving talks."
  images:
    - src: /assets/images/first_year.jpeg

- date: "September 2019"
  text: "Moved from Minnesota to Seattle to begin my PhD at the University of Washington."
  images: 
    - src: /assets/images/cross_country.jpg
      class: wide
    - src: /assets/images/state_fair.jpg
    - src: /assets/images/camping.jpg
